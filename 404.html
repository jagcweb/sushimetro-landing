<!DOCTYPE html>
<html lang="es-ES">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página no encontrada — Sushimetro</title>
  <meta name="description" content="Esta página no existe. Vuelve al inicio de Sushimetro, el contador de sushi gratis para Android." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090B;
      --cream: #FFF8ED;
      --cream-dim: rgba(255,248,237,0.62);
      --red: #FF4D4D;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--cream);
      font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
      text-align: center;
      padding: 28px;
    }
    h1 {
      margin: 0;
      font-family: 'Archivo Black', 'Arial Black', sans-serif;
      text-transform: uppercase;
      font-size: clamp(2.6rem, 7vw, 4.4rem);
      letter-spacing: -0.01em;
      line-height: 0.95;
    }
    p {
      margin: 16px auto 0;
      max-width: 36ch;
      color: var(--cream-dim);
      font-size: 1.05rem;
      line-height: 1.5;
    }
    a {
      display: inline-flex;
      margin-top: 28px;
      background: var(--red);
      color: #0b0705;
      font-weight: 700;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 999px;
    }
    a:hover { color: #0b0705; }
    a:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Esta página no existe. El contador sigue en la portada.</p>
    <a href="/">Volver a Sushimetro</a>
  </main>
</body>
</html>
